[build]
  publish = "public"
  functions = "netlify/functions"

# Valores públicos (aparecem nas páginas): não são segredos.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PRICE,SUPPORT_EMAIL,STATEMENT_DESCRIPTOR,PRODUCT_NAME,DOWNLOAD_URL"

[functions]
  node_bundler = "esbuild"

# Página de obrigado fora do Google e sem cache.
[[headers]]
  for = "/obrigado/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
